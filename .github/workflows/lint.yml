on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: lint

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling, local::.
          needs: lint

      - name: Lint
        shell: Rscript {0}
        run: lintr::lint_package()
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Spelling
        shell: Rscript {0}
        run: |
          typos <- spelling::spell_check_package()
          if (nrow(typos)) {
            print(typos)
            stop("Fix the spelling, or add the word to inst/WORDLIST.")
          }
